ai:
    createIssuePrompt: true
    enabled: false
    maxDailyRuns: 5
    neverSoleOracle: true
    provider: none
contracts:
    - description: Recommended Storybook component contract generated by Visual Hive.
      expectedConsoleErrors: []
      failOnConsoleError: false
      id: storybook-visual-hive-test-lab-fixtures-command-matrix-row-visual-stability
      runOn:
        pullRequest: true
        schedule: true
      screenshots:
        - fullPage: true
          mask: []
          name: visual-hive-test-lab-fixtures-command-matrix-row-desktop
          route: /iframe.html?id=visual-hive-test-lab-fixtures--command-matrix-row&viewMode=story
          viewport: desktop
        - fullPage: true
          mask: []
          name: visual-hive-test-lab-fixtures-command-matrix-row-mobile
          route: /iframe.html?id=visual-hive-test-lab-fixtures--command-matrix-row&viewMode=story
          viewport: mobile
      selectors:
        mustExist:
            - '#storybook-root'
        mustNotExist: []
        textMustExist: []
        textMustNotExist: []
      severity: high
      steps:
        - action: assertVisible
          description: Starter Storybook story is visible.
          selector: '#storybook-root'
          state: visible
          timeoutMs: 5000
      target: componentLibrary
      waitFor:
        - selector: '#storybook-root'
          state: visible
          timeoutMs: 15000
costPolicy:
    externalUpload:
        canary: false
        criticalContractsOnly: true
        full: true
        manual: true
        mutation: false
        onFailureOnly: true
        pullRequest: false
        schedule: true
    maxExternalScreenshotsPerRun: 5
    maxMonthlyExternalScreenshots: 5000
github:
    commentMarker: <!-- visual-hive-report -->
    enabled: true
    issueLabels:
        - visual-hive
        - test-failure
integrations:
    hive:
        enabled: true
mutation:
    enabled: true
    minScore: 0.7
    operators:
        - hide-critical-button
        - force-login-on-demo
        - api-500
        - mobile-overflow
        - broken-image
    runOn:
        pullRequest: false
        schedule: true
project:
    defaultBranch: main
    hiveConfigOrigin: generated
    hiveManagedBy: hive-integrated
    name: visual-hive-demo-site
    setupProfile: complex-app
    type: react-vite
selection:
    changedFiles:
        - contracts:
            - storybook-visual-hive-test-lab-fixtures-command-matrix-row-visual-stability
          pattern: src/**/*.stories.*
          risk: medium
        - contracts:
            - storybook-visual-hive-test-lab-fixtures-command-matrix-row-visual-stability
          pattern: src/components/**
          risk: medium
        - contracts:
            - storybook-visual-hive-test-lab-fixtures-command-matrix-row-visual-stability
          pattern: src/**
          risk: low
    ignoreChangedFiles: []
targets:
    componentLibrary:
        build: npm run build-storybook
        components:
            - src/components/**
        cost: cheap
        install: npm ci
        kind: storybook
        prSafe: true
        serve: npm run storybook -- --host 127.0.0.1 --port 6006
        stories:
            - src/**/*.stories.@(js|jsx|ts|tsx|mdx)
        url: http://127.0.0.1:6006
viewports:
    desktop:
        height: 900
        width: 1440
    mobile:
        height: 844
        width: 390
visual:
    artifactDir: .visual-hive/artifacts
    baselinePlatform: shared
    failOnMissingBaselineInCI: true
    maxDiffPixelRatio: 0.01
    snapshotDir: .visual-hive/snapshots
    updateSnapshots: false
